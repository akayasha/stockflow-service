spring.application.name=stockflow-backend

# --- Database (PostgreSQL) ---

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${DB_USERNAME:stockflow}
spring.datasource.password=${DB_PASSWORD:stockflow}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway migrations ---
# We declare Flyway manually in FlywayConfig so that the migration runs
# before the JPA EntityManagerFactory is built. Spring Boot 4 dropped the
# legacy auto-config that did this for us.

# --- HTTP server ---
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# --- JWT (HS256) ---
# Override the secret in any non-local environment. Generate with: openssl rand -base64 48
stockflow.security.jwt.secret=${JWT_SECRET:change-me-please-this-must-be-at-least-32-bytes-long-for-hs256}
stockflow.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- Business config ---
stockflow.app.tax-rate=${TAX_RATE:0.11}
stockflow.app.seed-demo-data=${SEED_DEMO_DATA:true}

# --- springdoc / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# --- Logging ---
logging.level.com.stockflow=INFO
logging.level.org.hibernate.SQL=INFO
